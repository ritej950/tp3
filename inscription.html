<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width , initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form action="merci.html" method="get" >
<h1>inscription au club informatique </h1>
<h2>vos informations </h2>
<label for="Nom">Nom </label>
<input type="text" id="nom" name="nom"><br>
<label for="Prenom"> Prenom </label>
<input type="text" id="prenom" name="prenom"><br>
<label for="email">Adresse e-mail </label>
<input type="email" id="email" name="email"><br>
<label for="telephone"> telephone </label>
<input type="tel" id="telephone" name="telephone"><br>
<label for="motdepasse"> mot de passe </label>
<input type="password" id="mdp" name="mdp" ><br>
<label for="naissance">Date de naissance :</label>
<input type="date" id="naissance" name="naissance" >
<fieldset>
<legend>niveau en informatique</legend>
<input type="radio" id="niveau-debutant" name="niveau" value="debutant">
<label for="niveau-debutant">Débutant</label><br>
<input type="radio" id="niveau-intermediare" name="niveau" value="intermediare">
<label for="niveau-intermédiaire">Intermédiaire</label><br>
<input type="radio" id="niveau-avancé" name="niveau" value="avancé">
<label for="niveau-avancé">Avancé</label><br>
</fieldset>
<fieldset>
<legend>ateliers souhaités</legend>
<input type="checkbox" id="atelier-python" name="ateliers" value="python" >
<label for="atelier-python">Atelier Python</label><br>
<input type="checkbox" id="atelier-jeux-video" name="ateliers" value="jeux-video" >
<label for="atelier-jeux-video">Atelier Jeux Vidéo</label>
</fieldset>
<br>
<label for="annee">Année d'études</label>
    <select id="annee" name="annee">
    <option value="" disabled selected>Choisir..</option>
    <option value="1">1ère</option>
    <option value="2">2ème</option>
    <option value="3">3ème</option>
    </select>
<br>
<br>
<label for="motivation">motivation</label>
<textarea id="motivation" name="motivation" rows="5" cols="40"></textarea><br><br>
<input type="checkbox" id="reglement" name="reglement">
<label for="reglement">J'accepte le règlement du club</label>
<br>
<br>
<input type="submit" value="Envoyer">
<input type="reset" value="Réinitialiser">
</form>
<p> club informatique</p>

</body>
</html>
